name: Omni-Video Generator
on:
  workflow_dispatch:
    inputs:
      user_prompt:
        description: 'Video Mission'
        required: true

jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - name: 1. استنساخ البيئة
        run: git clone https://github.com/11oooo/OpenManus.git .

      - name: 2. تثبيت الترسانة (بما فيها pydantic-settings)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python3 -m pip install --upgrade pip
          pip install openai tenacity loguru toml pydantic pydantic-settings requests tiktoken moviepy

      - name: 3. حقن الإعدادات وتجاوز القيود (The Bypass)
        run: |
          mkdir -p config
          # حقن مفتاح وهمي لتجاوز خطأ DaytonaSettings
          printf "[llm]\nmodel = \"Meta-Llama-3.3-70B-Instruct\"\nbase_url = \"https://api.sambanova.ai/v1\"\napi_key = \"946e5d64-edb7-4379-a4a5-3f8adf0b6030\"\n\n[agent]\nname = \"OpenManus\"\n\n[platform]\n# خدعة تجاوز Daytona\ndaytona_api_key = \"dummy_key\"\ndaytona_target = \"local\"" > config/config.toml

      - name: 4. الهجوم والإنتاج
        env:
          PYTHONPATH: ${{ github.workspace }}
          # حقن المتغيرات في البيئة أيضاً لضمان التجاوز
          DAYTONA_API_KEY: "dummy_key"
        run: |
          echo "🎬 انطلاق المحرك بعد تجاوز قيود Daytona..."
          python3 -u main.py --prompt "${{ github.event.inputs.user_prompt }}"

      - name: 5. سحب الغنائم
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-production
          path: |
            outputs/*
            *.mp4
