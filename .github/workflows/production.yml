name: OpenManus Cloud Production
on:
  workflow_dispatch:
    inputs:
      user_prompt:
        description: 'Your Command for OpenManus'
        required: true
        default: 'Search for Litecoin (LTC) and USDT prices'

jobs:
  run-manus:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies
        run: pip install openai tenacity loguru toml boto3 pydantic pydantic-settings requests

      - name: OpenManus Interaction
        env:
          PYTHONPATH: ${{ github.workspace }}
          OPENAI_API_KEY: "946e5d64-edb7-4379-a4a5-3f8adf0b6030"
          BASE_URL: "https://api.sambanova.ai/v1"
        run: |
          # تشغيل المحرك مع تمرير أمرك الحقيقي
          python3 main.py --prompt "${{ github.event.inputs.user_prompt }}"
