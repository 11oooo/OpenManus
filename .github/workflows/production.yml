name: Omni-Video Generator
on:
  workflow_dispatch:
    inputs:
      user_prompt:
        description: 'Video Mission'
        required: true

jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - name: 1. استنساخ وتجهيز البيئة
        run: |
          git clone https://github.com/11oooo/OpenManus.git .
          python3 -m pip install --upgrade pip
          pip install moviepy loguru toml pydantic pydantic-settings requests tiktoken opencv-python

      - name: 2. تثبيت FFmpeg وكشف المواد الخام
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          echo "🔎 التحقق من وجود الملفات:"
          ls -lh *.mp3 *.jpg *.py

      - name: 3. التنفيذ القسري لمحرك الفيديو (Direct Attack)
        run: |
          echo "🎬 إطلاق محرك مقيت الأصلي..."
          # سنقوم بتشغيل المحرك مباشرة وتوجيهه لاستخدام ملفاتك
          python3 mini_director.py --audio "من كلمات الدكتور مقيت الغزي (3).mp3" --image "IMG_٢٠٢٤١٢٠٣_٢٠١٢٠١.jpg" --output "final_video.mp4"

      - name: 4. سحب الفيديو الناتج
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-production
          path: ./*.mp4
