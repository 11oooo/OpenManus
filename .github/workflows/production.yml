name: OpenManus Cloud Production
on:
  workflow_dispatch:
    inputs:
      user_prompt:
        description: 'Command'
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-manus:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Environment and Run
        env:
          OPENAI_API_KEY: "946e5d64-edb7-4379-a4a5-3f8adf0b6030"
          BASE_URL: "https://api.sambanova.ai/v1"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python3 -m pip install --upgrade pip
          pip install openai tenacity loguru toml boto3 pydantic pydantic-settings requests
          echo "🚀 Starting OpenManus Engine..."
          python3 -u main.py --prompt "${{ github.event.inputs.user_prompt }}"
